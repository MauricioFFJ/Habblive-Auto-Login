name: Command - Respeitar

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Nome do usuário"
        required: true
        type: string
      targets:
        description: "Contas alvo (ex: all ou 1,2,3)"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  send-command:
    runs-on: ubuntu-latest

    steps:
      # IMPORTANTE:
      # O checkout precisa acontecer ANTES de qualquer comando git.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publicar comando Respeitar
        env:
          USERNAME: ${{ inputs.username }}
          TARGETS: ${{ inputs.targets }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          command_id = str(time.time_ns())

          username = os.environ["USERNAME"].strip()
          targets = os.environ["TARGETS"].strip() or "all"

          if not username:
              raise SystemExit("Nome do usuário não pode estar vazio.")

          command = {
              "id": command_id,
              "action": "respect",
              "targets": targets,
              "username": username
          }

          commands_dir = Path("commands")
          commands_dir.mkdir(parents=True, exist_ok=True)

          command_file = commands_dir / f"{command_id}.json"

          command_file.write_text(
              json.dumps(
                  command,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("=" * 40)
          print("COMANDO PUBLICADO COM SUCESSO")
          print("=" * 40)
          print(f"ID:       {command_id}")
          print("Ação:     respect")
          print(f"Contas:   {targets}")
          print(f"Usuário:  {username}")
          print(f"Arquivo:  {command_file}")
          print("=" * 40)
          PY

      - name: Commitar comando
        run: |
          git add commands/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "command: respect"

          git push
