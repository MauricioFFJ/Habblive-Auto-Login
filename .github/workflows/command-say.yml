name: 🎤 Comando - Falar

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Frase que as contas devem falar"
        required: true
        type: string

      targets:
        description: "Contas: all ou números separados por vírgula (ex: 1,2,7,20)"
        required: true
        default: "all"
        type: string

permissions:
  contents: write

jobs:
  send-command:
    runs-on: ubuntu-latest

    steps:
      - name: Criar comando
        env:
          MESSAGE: ${{ inputs.message }}
          TARGETS: ${{ inputs.targets }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import base64
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          command_id = str(time.time_ns())
          targets = os.environ["TARGETS"].strip()

          if targets.lower() == "all":
              targets_value = "all"
          else:
              targets_value = [
                  int(x.strip())
                  for x in targets.split(",")
                  if x.strip()
              ]

          command = {
              "id": command_id,
              "action": "say",
              "message": os.environ["MESSAGE"],
              "targets": targets_value
          }

          content = json.dumps(
              command,
              ensure_ascii=False,
              indent=2
          )

          encoded_content = base64.b64encode(
              content.encode("utf-8")
          ).decode("ascii")

          path = f"commands/{command_id}.json"

          url = (
              f"https://api.github.com/repos/"
              f"{repository}/contents/{path}"
          )

          payload = json.dumps({
              "message": f"command: say {command_id}",
              "content": encoded_content
          }).encode("utf-8")

          request = urllib.request.Request(
              url,
              data=payload,
              method="PUT",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "Habblive-Auto-Login"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(
                  response.read().decode("utf-8")
              )

          print(f"Comando publicado com sucesso.")
          print(f"ID: {command_id}")
          print(f"Arquivo: {path}")
          print(f"Commit: {result['commit']['sha']}")
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
